# Orquestación local de Kodecol Web.
#   Producción:  docker compose -f docker/compose.yaml up web
#   Desarrollo:  docker compose -f docker/compose.yaml up web-dev  (hot reload)

name: kodecol

services:
  web:
    image: kodecol-web
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      # Configurable con WEB_PORT si el 3000 está ocupado en el host
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped

  web-dev:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "corepack enable pnpm && pnpm install && pnpm dev --hostname 0.0.0.0"
    ports:
      - "3001:3000"
    volumes:
      - ..:/app
      # node_modules propios del contenedor (no se mezclan con los del host)
      - web_dev_node_modules:/app/node_modules
    environment:
      # Watchers por polling: el hot reload por inotify no cruza el bind mount en WSL2
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true

volumes:
  web_dev_node_modules:
